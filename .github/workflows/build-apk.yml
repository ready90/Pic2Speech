name: Build APK

# 触发条件：推代码 / 手动点按钮
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # Chaquopy 要求「构建机的 Python 版本」与「App 里的 Python 版本」一致，
      # app/build.gradle.kts 里写的是 3.13，这里必须对上。
      # 用 3.13 而不是 3.10：Chaquopy 仓库里 cp313 的原生轮子才齐全
      # （cp310 的 yarl 最高只有 1.4.2，不满足 aiohttp 3.10.10 要求的 >=1.12）。
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 注意：setup-android 的 v3 标签默认 packages 是 'tools platform-tools'，
      # 而 'tools' 包已从 Android SDK 仓库移除，会报
      #   Warning: Failed to find package 'tools' -> sdkmanager exit code 1
      # 导致整步失败。必须显式覆盖为 platform-tools。
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: 安装 SDK 组件
        run: |
          set -e
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 把仓库 Secret 里的智谱 Key 生成成 Python 模块，随 APK 一起打包，
      # App 启动时自动填入，用户无需手输。
      # 生成的 _secret.py 已在 .gitignore 中 ⇒ Key 不会进入代码仓库。
      - name: 注入内置 API Key（来自仓库 Secret）
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python tools/inject_key.py

      # 这一步会联网从 chaquo.com 下载 Python 运行时与安卓版依赖 wheel
      # （aiohttp / multidict / frozenlist / yarl），首次约 5~10 分钟。
      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pic2speech-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
